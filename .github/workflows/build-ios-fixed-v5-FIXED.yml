      - name: Verify V5 source markers
        run: |
          set -euo pipefail
          grep -Fq 'V3 EPOC95: Symbian platform 9.5 detected as epoc95' upstream/src/emu/system/src/software.cpp
          grep -Fq 'V3 EPOC95 MIGRATION' upstream/src/emu/system/src/devices.cpp
          grep -Fq 'V3 ROMBSS:' upstream/src/emu/kernel/src/codeseg.cpp
          grep -Fq 'V5 SVC95:' upstream/src/emu/kernel/src/libmanager.cpp
          grep -Fq 'V5 SVCMISS:' upstream/src/emu/kernel/src/libmanager.cpp
          grep -Fq 'V5 CHANNELREQ:' upstream/src/emu/kernel/src/svc.cpp
          grep -Fq 'V5 CHANCREATE:' upstream/src/emu/kernel/src/svc.cpp
          grep -Fq 'V5 CODEDUMP: reentrancy guard enabled' upstream/src/emu/kernel/src/codedump_collector.cpp
          grep -Fq 'Select Files in This Folder' upstream/src/emu/ios/app/RootViewController.mm
          echo 'V5 source markers: PASS'

      - name: Apply upstream iOS submodule patches
        working-directory: upstream
        run: |
          set -euo pipefail
          P="$PWD/.github/ios-build/patches"
          if [ -d "$P" ]; then
            git -C src/external/cubeb                     apply "$P/cubeb.patch"  || true
            git -C src/external/fmt                       apply "$P/fmt.patch"    || true
            git -C src/external/ffmpeg                    apply "$P/ffmpeg.patch" || true
            git -C src/external/dynarmic/externals/oaknut apply "$P/oaknut.patch" || true
            if [ -f .github/ios-build/ffmpeg/build-ios-device.sh ]; then
              cp .github/ios-build/ffmpeg/build-ios-device.sh src/external/ffmpeg/
              chmod +x src/external/ffmpeg/build-ios-device.sh
            fi
          fi

      - name: Select newest installed Xcode
        run: |
          set -euo pipefail
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$XC" ] || XC=/Applications/Xcode.app
          sudo xcode-select -s "$XC/Contents/Developer"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Ninja
        run: brew install ninja

      - name: Install CMake 3.31.6
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/cmake.tar.gz" \
            https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz
          tar xzf "$RUNNER_TEMP/cmake.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cmake-3.31.6-macos-universal/CMake.app/Contents/bin" >> "$GITHUB_PATH"

      - name: Build FFmpeg for iPhone if needed
        working-directory: upstream
        run: |
          set -euo pipefail
          if [ ! -f src/external/ffmpeg/macos/arm64-device/lib/libavcodec.a ]; then
            chmod +x src/external/ffmpeg/build-ios-device.sh
            (cd src/external/ffmpeg && ./build-ios-device.sh)
          else
            echo 'Using prebuilt FFmpeg device libraries.'
          fi

      - name: Configure iPhone arm64 build
        working-directory: upstream
        run: |
          set -euo pipefail
          cmake -S . -B build-ios-device -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build EKA2L1 app
        working-directory: upstream
        run: |
          set -euo pipefail
          cmake --build build-ios-device --target eka2l1 -j"$(sysctl -n hw.logicalcpu)"

      - name: Verify V5 binary markers
        working-directory: upstream
        run: |
          set -euo pipefail
          BIN="build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
          test -x "$BIN"

          # Do NOT use `strings "$BIN" | grep -q ...` together with pipefail.
          # grep -q exits as soon as it finds a marker, which closes the pipe early;
          # Apple's llvm-strings then receives SIGPIPE / reports "failed to flush output",
          # causing a false build failure even though the binary compiled successfully.
          STRINGS_OUT="$RUNNER_TEMP/eka2l1-v5-binary.strings"
          strings "$BIN" > "$STRINGS_OUT"

          markers=(
            'V5 SVC95:'
            'V5 SVCMISS:'
            'V5 CHANNELREQ:'
            'V5 CHANCREATE:'
            'V5 CODEDUMP: reentrancy guard enabled'
            'V3 EPOC95:'
            'V3 ROMBSS:'
          )

          for marker in "${markers[@]}"; do
            if grep -Fq "$marker" "$STRINGS_OUT"; then
              echo "PASS: $marker"
            else
              echo "ERROR: missing binary marker: $marker" >&2
              exit 1
            fi
          done

          echo 'V5 binary markers: PASS'

      - name: Package unsigned IPA
        working-directory: upstream
        run: |
          set -euo pipefail
          APP="build-ios-device/src/emu/ios/eka2l1.app"
          test -d "$APP"
          rm -rf ipa-stage EKA2L1-iOS-fixed-v5-unsigned.ipa
          mkdir -p ipa-stage/Payload
          cp -R "$APP" ipa-stage/Payload/EKA2L1.app
          rm -rf ipa-stage/Payload/EKA2L1.app/_CodeSignature
          rm -f ipa-stage/Payload/EKA2L1.app/embedded.mobileprovision
          (cd ipa-stage && /usr/bin/zip -qry ../EKA2L1-iOS-fixed-v5-unsigned.ipa Payload)
          /usr/bin/unzip -t EKA2L1-iOS-fixed-v5-unsigned.ipa >/dev/null
          ls -lh EKA2L1-iOS-fixed-v5-unsigned.ipa
          shasum -a 256 EKA2L1-iOS-fixed-v5-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
