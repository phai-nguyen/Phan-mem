      - name: Verify V23 Vietnamese UI separation and source coverage
        run: |
          set -euo pipefail
          APP=upstream/src/emu/ios/app
          ROOT="$APP/RootViewController.mm"
          LOC="$APP/EKALocalization.mm"
          CMAKE=upstream/src/emu/ios/CMakeLists.txt

          grep -Fq 'V23 VI18N:' "$LOC"
          grep -Fq 'Ngôn ngữ ứng dụng' "$LOC"
          grep -Fq 'Theo hệ thống' "$LOC"
          grep -Fq 'Tiếng Việt' "$LOC"
          grep -Fq 'Tạo sao lưu (.zip)' "$LOC"
          grep -Fq 'Đồng bộ và Sao lưu' "$LOC"
          grep -Fq 'Ngôn ngữ' "$LOC"
          grep -Fq 'Nokia/Symbian Language' "$LOC"

          grep -Fq 'showAppLanguageMenu' "$ROOT"
          grep -Fq 'EKAL(@"App Language")' "$ROOT"
          grep -Fq 'EKASetAppLanguageMode' "$ROOT"
          grep -Fq 'EKAInitializeLocalization' "$ROOT"

          grep -Fq 'app/EKALocalization.h' "$CMAKE"
          grep -Fq 'app/EKALocalization.mm' "$CMAKE"

          python3 - <<'PYCODE'
          from pathlib import Path
          root = Path('upstream/src/emu/ios/app/RootViewController.mm').read_text()
          begin = root.index('// ---- EKA2L1 frontend language')
          end = root.index('// ---- Settings (N-Gage)', begin)
          block = root[begin:end]
          assert 'set_device_language' not in block
          assert 'get_device_language' not in block
          print('V23 VI18N app language is isolated from Nokia/Symbian firmware language: PASS')
          PYCODE

          grep -Fq 'V23 IOS PERFQOS:' upstream/src/emu/ios/src/thread.cpp
          grep -Fq 'V20 AUDIOWAKE:' upstream/src/emu/kernel/src/kernel.cpp
          grep -Fq 'V19 DYNCOM ATOMICSTOP:' upstream/src/emu/cpu/src/dyncom/arm_dyncom.cpp
          grep -Fq 'V18 MSGQ40 RECV:' upstream/src/emu/kernel/src/msgqueue.cpp
          grep -Fq 'V17 MSGQ ORDER:' upstream/src/emu/kernel/src/msgqueue.cpp
          grep -Fq 'V16 MMF95 QRETRY:' upstream/src/emu/services/src/audio/mmf/dev.cpp

          echo 'V23 Vietnamese UI + V9-V23 preservation: PASS'

      - name: Apply upstream iOS submodule patches
        working-directory: upstream
        run: |
          set -euo pipefail
          P="$PWD/.github/ios-build/patches"
          if [ -d "$P" ]; then
            git -C src/external/cubeb                     apply "$P/cubeb.patch"  || true
            git -C src/external/fmt                       apply "$P/fmt.patch"    || true
            git -C src/external/ffmpeg                    apply "$P/ffmpeg.patch" || true
            git -C src/external/dynarmic/externals/oaknut apply "$P/oaknut.patch" || true
            if [ -f .github/ios-build/ffmpeg/build-ios-device.sh ]; then
              cp .github/ios-build/ffmpeg/build-ios-device.sh src/external/ffmpeg/
              chmod +x src/external/ffmpeg/build-ios-device.sh
            fi
          fi

      - name: Select newest installed Xcode
        run: |
          set -euo pipefail
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$XC" ] || XC=/Applications/Xcode.app
          sudo xcode-select -s "$XC/Contents/Developer"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Ninja
        run: brew install ninja

      - name: Install CMake 3.31.6
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/cmake.tar.gz" \
            https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz
          tar xzf "$RUNNER_TEMP/cmake.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cmake-3.31.6-macos-universal/CMake.app/Contents/bin" >> "$GITHUB_PATH"

      - name: Build FFmpeg for iPhone if needed
        working-directory: upstream
        run: |
          set -euo pipefail
          if [ ! -f src/external/ffmpeg/macos/arm64-device/lib/libavcodec.a ]; then
            chmod +x src/external/ffmpeg/build-ios-device.sh
            (cd src/external/ffmpeg && ./build-ios-device.sh)
          else
            echo 'Using prebuilt FFmpeg device libraries.'
          fi

      - name: Configure iPhone arm64 build
        working-directory: upstream
        run: |
          set -euo pipefail
          cmake -S . -B build-ios-device -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build EKA2L1 app
        working-directory: upstream
        run: |
          set -euo pipefail
          cmake --build build-ios-device --target eka2l1 -j"$(sysctl -n hw.logicalcpu)"

      - name: Verify V23 Vietnamese UI FIXED1 binary markers
        working-directory: upstream
        run: |
          set -euo pipefail
          BIN="build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
          test -x "$BIN"
          STRINGS_OUT="$RUNNER_TEMP/eka2l1-v23-vi-fixed1-binary.strings"
          strings "$BIN" > "$STRINGS_OUT"
          markers=(
            'V23 VI18N:'
            'App Language'
            'Follow System'
            'Nokia/Symbian Language'
            'V23 IOS PERFQOS:'
            'V22 AUDIORECV:'
            'V22 AUDIOPATH SUMMARY:'
            'V22 AUDIOPATH OVERLAP:'
            'V21 CPUSLICE:'
            'V20 AUDIOWAKE:'
            'V20 RESCHED BEGIN:'
            'V20 RESCHED END:'
            'V19 DYNCOM ATOMICSTOP:'
            'V18 MMF95 EVTSEND:'
            'V18 MSGQ40 ARM:'
            'V18 MSGQ40 WAKE-BEFORE:'
            'V18 MSGQ40 WAKE-AFTER:'
            'V18 MSGQ40 RECV:'
            'V17 MSGQ ORDER:'
            'V16 MMF95 QRETRY:'
            'V15 DSP RETRY:'
            'V15 MMF95 RETRY:'
            'V14 DSP REFILL:'
            'V14 MMF95 STREAMINIT:'
            'V14 MMF95 FORMAT:'
            'V14 MMF95 CONFIGBUF:'
            'V14 MMF95 GETBUF:'
            'V14 MMF95 PLAYDATA:'
            'V13 MMF95 PRIORITYABI:'
            'V13 MMF95 CONFIG:'
            'V13 MMF95 ABI112:'
            'V13 MMF95 PLAYINIT:'
            'V12 MMF95 PRIORITY: opcode=45 dispatch'
            'V11 AKNICON95 RASTER:'
            'V11 CONTENTDIM PRECOMPLETE:'
            'V11 CONTENTDIM POSTCOMPLETE:'
            'V11 FBS95 FONT: layout=v2'
            'V11 LEAVE5:'
            'V10 AKNICON95 CONTENTDIM:'
            'V10 IPCERR:'
            'V9 FBS95 CREATE:'
            'V8 IPCCTX:'
            'V8 ALF95:'
            'V8 ALF95 COMPAT:'
            'V8 ALF95 IPCMISS:'
            'V7 AKNICON95:'
            'V7 OPENVG95 COVERAGE:'
            'V6 OPENVG95:'
            'V5 SVC95:'
            'V5 SVCMISS:'
            'V5 CODEDUMP: reentrancy guard enabled'
            'V3 EPOC95:'
            'V3 ROMBSS:'
          )
          for marker in "${markers[@]}"; do
            if grep -Fq "$marker" "$STRINGS_OUT"; then
              echo "PASS: $marker"
            else
              echo "ERROR: missing binary marker: $marker" >&2
              exit 1
            fi
          done
          python3 - <<'PYCODE'
          from pathlib import Path
          data = Path("build-ios-device/src/emu/ios/eka2l1.app/eka2l1").read_bytes()
          required = [
              "Ngôn ngữ ứng dụng",
              "Theo hệ thống",
              "Tiếng Việt",
              "Ngôn ngữ",
              "Tạo sao lưu (.zip)",
              "Đồng bộ và Sao lưu",
          ]
          for text in required:
              if text.encode("utf-8") not in data and text.encode("utf-16le") not in data:
                  raise SystemExit(f"ERROR: missing Unicode localization marker in binary: {text}")
              print(f"PASS Unicode: {text}")
          print("V23 Vietnamese Unicode binary markers: PASS")
          PYCODE
          echo 'V23 Vietnamese UI binary markers + V9-V23 preservation: PASS'

      - name: Package unsigned IPA
        working-directory: upstream
        run: |
          set -euo pipefail
          APP="build-ios-device/src/emu/ios/eka2l1.app"
          test -d "$APP"
          rm -rf ipa-stage EKA2L1-iOS-fixed-v23-vi-fixed1-unsigned.ipa
          mkdir -p ipa-stage/Payload
          cp -R "$APP" ipa-stage/Payload/EKA2L1.app
          rm -rf ipa-stage/Payload/EKA2L1.app/_CodeSignature
          rm -f ipa-stage/Payload/EKA2L1.app/embedded.mobileprovision
          (cd ipa-stage && /usr/bin/zip -qry ../EKA2L1-iOS-fixed-v23-vi-fixed1-unsigned.ipa Payload)
          /usr/bin/unzip -t EKA2L1-iOS-fixed-v23-vi-fixed1-unsigned.ipa >/dev/null
          ls -lh EKA2L1-iOS-fixed-v23-vi-fixed1-unsigned.ipa
          shasum -a 256 EKA2L1-iOS-fixed-v23-vi-fixed1-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EKA2L1-iOS-fixed-v23-VI-FIXED1-IPA
          path: upstream/EKA2L1-iOS-fixed-v23-vi-fixed1-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
