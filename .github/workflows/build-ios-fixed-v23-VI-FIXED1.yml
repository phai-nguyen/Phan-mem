waiter =",\n    indent + "        !avail_notifies_.empty() || (avail_callback_.first != nullptr);",\n    "",\n    indent + "    msg_data new_data;",\n    indent + "    new_data.resize(max_msg_length_);",\n    "",\n    indent + "    const std::uint8_t *target_data_to_copy =",\n    indent + "        reinterpret_cast<const std::uint8_t *>(target_data);",\n    indent + "    std::copy(target_data_to_copy,",\n    indent + "        target_data_to_copy + buffer_size, &new_data[0]);",\n    "",\n    indent + "    // Publish first. Only then wake data-available waiters/callback.",\n    indent + "    msgs_.push(new_data);",\n    "",\n    indent + "    if (was_empty) {",\n    indent + "        for (auto &notify : avail_notifies_) {",\n    indent + "            notify.complete(0);",\n    indent + "        }",\n    "",\n    indent + "        avail_notifies_.clear();",\n    indent + "        if (avail_callback_.first) {",\n    indent + "            avail_callback_.first(avail_callback_.second);",\n    indent + "        }",\n    "",\n    indent + "        if (had_available_waiter) {",\n    indent + "            LOG_TRACE(KERNEL,",\n    indent + \'                "V17 MSGQ ORDER: data queued before availability notification");\',\n    indent + "        }",\n    indent + "    }",\n    "",\n    indent + "    return true;",\n    indent + "}",\n]\nnew_func = func_header + "\\n".join(body_lines)\n\nnew_text = text[:line_start] + new_func + text[close_brace + 1:]\n\n# Add logging dependency by semantic include match, not fixed whitespace.\nif "#include <common/log.h>" not in new_text:\n    inc = re.search(\n        r\'(?m)^(?P<i>[ \\t]*)#include[ \\t]*<kernel/kernel\\.h>[ \\t]*$\',\n        new_text\n    )\n    if not inc:\n        raise SystemExit(\n            "V17 FIXED3: kernel/kernel.h include anchor not found; "\n            "cannot add logging dependency safely"\n        )\n    replacement = (\n        inc.group("i") + "#include <common/log.h>\\n" + inc.group(0)\n    )\n    new_text