      - name: Install V9 FBS95 BitmapCreate ABI fix
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64, gzip, hashlib, pathlib
          rel = 'src/emu/services/src/fbs/impls/bitmap.cpp'
          data = ''
          expected = '0ea4f0b817e344635e9b0bf4a23580910bda3ba240182b9d824294fbe2ea43de'
          raw = gzip.decompress(base64.b64decode(data))
          got = hashlib.sha256(raw).hexdigest()
          if got != expected:
              raise SystemExit(f'V9 bitmap payload hash mismatch: {got}')
          out = pathlib.Path('upstream') / rel
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(raw)
          print(f'installed V9 {rel} sha256={got}')
          PYCODE

