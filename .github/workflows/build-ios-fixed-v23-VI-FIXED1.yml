          script = 'from pathlib import Path\nimport hashlib\nimport re\nimport subprocess\n\npath = Path("upstream/src/emu/kernel/src/msgqueue.cpp")\ntext = path.read_text(encoding="utf-8")\n\nprint("V17 FIXED3 upstream HEAD:",\n      subprocess.check_output(["git", "-C", "upstream", "rev-parse", "HEAD"],\n                              text=True).strip())\nprint("V17 FIXED3 msgqueue.cpp pre-SHA256:",\n      hashlib.sha256(text.encode("utf-8")).hexdigest())\n\n# Locate exactly one msg_queue::send() definition without depending on tabs,\n# spaces, line numbers, or a particular upstream SHA.\nmatches = list(re.finditer(\n    r\'(?m)^[ \\t]*bool[ \\t]+msg_queue::send[ \\t]*\\(\',\n    text\n))\nif len(matches) != 1:\n    raise SystemExit(\n        f"V17 FIXED3: expected exactly one msg_queue::send definition, "\n        f"found {len(matches)}; refusing ambiguous rewrite"\n    )\n\nsig_pos = matches[0].start()\nline_start = text.rfind("\\n", 0, sig_pos) + 1\nopen_brace = text.find("{", matches[0].end())\nif open_brace < 0:\n    raise SystemExit("V17 FIXED3: opening brace of msg_queue::send not found")\n\n# Structural brace match. The current target function contains no brace-bearing\n# string/comment constructs; semantic checks below additionally guard the edit.\ndepth = 0\nclose_brace = None\nfor i in range(open_brace, len(text)):\n    ch = text[i]\n    if ch == "{":\n        depth += 1\n    elif ch == "}":\n        depth -= 1\n        if depth == 0:\n            close_brace = i\n            break\n\nif close_brace is None:\n    raise SystemExit("V17 FIXED3: closing brace of msg_queue::send not found")\n\nold_func = text[line_start:close_brace + 1]\n\n# Require the exact old semantics targeted by V17, but not exact formatting.\nrequired = [\n    "buffer_size > max_msg_length_",\n    "msgs_.size() == max_length_",\n    "msgs_.empty()",\n    "avail_notifies_",\n    "avail_callback_.first",\n    "avail_callback_.second",\n    "msg_data new_data",\n    "new_data.resize(max